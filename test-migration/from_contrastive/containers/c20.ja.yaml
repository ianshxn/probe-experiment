model_guidance: 簡潔な文体を用いること。質問は前置きや周辺の文章を伴わない、単独の簡潔な質問とし、短く一意に定まる答えを持つこと。回答は内容だけから一意に定まり、作成者への追加の問い合わせを要さないこと。内容には、回答の根拠となる事実をすべて記載し、一般知識や外部の情報を要しないようにすること。内容そのものに回答を記載しないこと。
