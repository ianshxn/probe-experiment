model_guidance: Free-response. TASK must admit a determinate final answer that can be stated as
  a single value or corrected item, and must be answerable from CONTENT alone without asking
  the writer anything further. CONTENT must supply every fact the answer depends on, so that no
  outside or general knowledge is needed. CONTENT must not state the answer itself.
