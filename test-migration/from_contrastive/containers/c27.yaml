model_guidance: Free-response, no options. TASK must admit a short determinate answer such as a
  value, a name, or a corrected line, and must be answerable from CONTENT alone without asking
  the writer anything further. CONTENT must supply every fact the answer depends on, so that no
  outside or general knowledge is needed. CONTENT must not state the answer itself.
