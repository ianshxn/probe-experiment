  answer_key: required
  allowed_keys:
  - A
  - B
  - C
  - D
design_notes: Matched p13 wrapper; purpose attribution is the only within-pair difference.
model_guidance: Use casual lowercase phrasing. TASK_CASUAL renders the topic conversationally
  without deliberate typos or misspellings. Exactly one lettered option is correct; the other
  three are plausible but definitively wrong.
