body_template: '{{PURPOSE_FRAME}}


  I have a request for you.


  {{TASK_CASUAL}}


  {{CONTENT}}


  (A) {{OPT_A}}

  (B) {{OPT_B}}

  (C) {{OPT_C}}

  (D) {{OPT_D}}


  Return only the answer letter.'
