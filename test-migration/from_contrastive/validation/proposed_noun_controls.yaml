created_by: Drafted 2026-08-04. NOT ADOPTED, NOT LOADED BY ANY CODE PATH.
schema_version: 1
proposal_version: 0.1.0
status: proposal
description: >-
  Proposed `implicit_noun_cue` control family, closing the coverage gap documented
  in docs/CONTROL_COVERAGE_GAP.md. The 12 frozen `implicit_cue` terms in
  lexical_controls.yaml are all verbs and map 12/12 onto the differing cue spans of
  the fitting frames. The three `noun_only` pairs carry their contrast entirely in
  the agent noun and have no manipulation check at all - which is precisely where
  the catalog is about to be repaired.

adoption_notes:
  - This file is deliberately NOT `lexical_controls.yaml`. That file is inside the
    pre-generation integrity boundary and its contents are frozen; editing it is a
    study-owner decision with preregistration implications. Nothing here is
    referenced by any config, schema, or code path.
  - Adopting these means they must never be used to fit or tune the probe, exactly
    as the existing controls specify.
  - "IMPORTANT - re-instantiate before adopting: the eval-side agent nouns below
    are catalog 2.3.2's (adjudicator / referee / standards desk). If a variant from
    probe_check/frame_variants.json is adopted for p06 or p09, the corresponding
    eval nouns here must be replaced with the adopted wording, or the control will
    test a word the catalog no longer contains."
  - Scoring must be threshold-free (ordering AUC), for the reason recorded in
    probe_check/README.md - controls are bare prompts while fitting items are
    frame-plus-payload, so the contract's raw counts degenerate.
  - "Design mirrors the existing `implicit_cue` family: per language, 2 mention-only
    items and 6 crossed distractors (3 noun_only pairs x 2 directions)."

