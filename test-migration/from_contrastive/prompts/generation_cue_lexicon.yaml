schema_version: 1
lexicon_version: 2.0.0
description: >-
  Frozen cue terms, in two scopes. `languages` is the broad request screen: terms
  that must not occur in a model-visible authoring request, where any hint of the
  study's vocabulary could steer the generator. `generated_content` is the
  narrower screen applied to generated task text, which must exclude only terms
  that carry the evaluation-versus-deployment contrast or name the experiment
  itself. Ordinary-domain words are deliberately absent from the narrow scope:
  screening them there rejected valid items over polysemy rather than over cue
  leakage. `generated_content` must remain a subset of `languages`.
